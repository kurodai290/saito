<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simple Cloud</title>
<style>
body{font-family:sans-serif;max-width:700px;margin:40px auto;padding:20px}
textarea{width:100%;height:120px}
button{padding:10px 16px;margin-top:10px}
.item{border:1px solid #ccc;padding:10px;margin-top:10px}
</style>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>
<h1>簡易クラウドメモ</h1>

<textarea id="memo" placeholder="メモを入力"></textarea><br>
<button onclick="saveMemo()">保存</button>

<h2>保存データ</h2>
<div id="list"></div>

<script>
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  databaseURL: "YOUR_DATABASE_URL",
  projectId: "YOUR_PROJECT_ID"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

function saveMemo(){
  const text=document.getElementById("memo").value;
  if(!text.trim()) return;
  db.ref("memos").push({
    text:text,
    time:new Date().toLocaleString("ja-JP")
  });
  document.getElementById("memo").value="";
}

db.ref("memos").on("value",(snap)=>{
  const data=snap.val();
  const list=document.getElementById("list");
  list.innerHTML="";
  if(!data) return;
  Object.keys(data).reverse().forEach(k=>{
    const d=data[k];
    list.innerHTML += `<div class="item">${d.text}<br><small>${d.time}</small></div>`;
  });
});
</script>
</body>
</html>
